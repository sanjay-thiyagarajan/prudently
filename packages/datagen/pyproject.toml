[project]
name = "datagen"
version = "0.1.0"
description = "Synthetic hospital data generator for Prudently (roster, inventory, admissions, scripted flu surge)"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-firestore>=2.19",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py312"]
