name: CI

# No CI existed at all before this — make lint/make test were real but entirely local/manual,
# so a regression could merge without either ever running. This runs the same gates a
# contributor is expected to run locally, on every push/PR, nothing more.
#
# ARMOR_BACKEND/OBSERVABILITY_BACKEND pinned to local here even though .env.example recommends
# `vertex` for real dev: the vertex backends make a live `google.auth.default()` call at
# agents/supply/agent.py's module import time (its own tracer-bootstrap block), which raises
# DefaultCredentialsError with no ADC configured — exactly this runner's situation. Caught live
# by this workflow's own first run, not in review.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: apps/api — lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      ARMOR_BACKEND: local
      OBSERVABILITY_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run black --check .
      - run: uv run pylint agents routes services
      - run: uv run pytest --cov --cov-fail-under=80

  web:
    name: apps/web — lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
