[project]
name = "prudently-api"
version = "0.1.0"
description = "Prudently hospital operations agent fleet — FastAPI + ADK backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "google-adk>=1.31",
    "google-cloud-aiplatform>=1.70",
    "google-cloud-firestore>=2.19",
    "google-cloud-pubsub>=2.25",
    "google-cloud-secret-manager>=2.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-gcp-trace>=1.7",
    "opentelemetry-exporter-gcp-logging>=1.7",
]

[dependency-groups]
dev = [
    "black>=24.8",
    "pylint>=3.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["agents.shift.burndown", "agents.supply.reorder", "services.simclock", "services.platform"]
omit = ["tests/*", "evals/*"]

[tool.coverage.report]
fail_under = 80

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
