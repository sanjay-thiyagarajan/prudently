[project]
name = "prudently-api"
version = "0.1.0"
description = "Prudently hospital operations agent fleet — FastAPI + ADK backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "google-adk[a2a]>=1.31",
    "google-cloud-aiplatform>=1.70",
    "google-cloud-firestore>=2.19",
    "google-cloud-pubsub>=2.25",
    "google-cloud-secret-manager>=2.20",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-gcp-trace>=1.7",
    "opentelemetry-exporter-gcp-logging>=1.7",
    "google-cloud-modelarmor>=0.7.1",
    "google-cloud-trace>=1.13",
    "google-cloud-logging>=3.11",
    "sse-starlette>=3.4.8",
    "firebase-admin>=6.5",
    "opentelemetry-instrumentation-httpx>=0.63b1",
    "opentelemetry-instrumentation-asgi>=0.63b1",
]

[dependency-groups]
dev = [
    "black>=24.8",
    "pylint>=3.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pre-commit>=3.8",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# `include` (path globs), not `source` (importable module names) — deliberately, and it is not
# a cosmetic difference. With `source`, coverage re-imports each named module at report time to
# account for files the run never touched; naming `agents.supply.reorder` therefore drags in
# `agents/supply/__init__.py` -> `agent.py`, which constructs a `RemoteA2aAgent` and installs
# the global httpx instrumentor. Under coverage's tracer that import never returns, so
# `make test` hung indefinitely rather than failing — a broken quality gate that looked like a
# slow one. `include` filters by path and imports nothing, so the gate runs in ~4s.
#
# Scope is unchanged in spirit: pure-logic modules only. ADK orchestration glue (`agent.py`
# files, `services/memory.py`, `services/state.py`, `services/autonomy.py`) stays out — proven
# on Day 3 that merely importing those under pytest can trigger live GCP calls.
include = [
    "agents/shift/burndown.py",
    "agents/inventory/par_levels.py",
    "agents/supply/reorder.py",
    "agents/hr/credentialing.py",
    "services/simclock.py",
    "services/platform/armor_local.py",
    "services/platform/gateway_local.py",
    "services/admissions.py",
    "services/payroll.py",
    "services/inventory_sim.py",
    "services/triggers.py",
    "services/redaction.py",
]
omit = ["tests/*", "evals/*"]

[tool.coverage.report]
fail_under = 80

[tool.uv]
package = false
